<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 Ракетная игра</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 80%);
      font-family: "Arial", sans-serif;
      color: white;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 80%);
    }
    #controls {
      display: none;
      justify-content: space-around;
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      padding: 10px;
    }
    #controls button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 2rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
    @media (max-width: 768px) {
      #controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // === Размер ===
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // === Звезды (фон) ===
    const stars = [];
    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: 0.3 + Math.random() * 0.5
      });
    }

    // === Ракета ===
    const rocket = {
      x: canvas.width / 2,
      y: canvas.height - 150,
      width: 50,
      height: 90,
      speed: 7,
      dx: 0,
      flameTime: 0
    };

    let score = 0;
    let asteroids = [];
    let gameOver = false;

    // === Функции ===
    function drawStars() {
      ctx.fillStyle = "#fff";
      for (let s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.speed;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
      }
    }

    function drawRocket() {
      ctx.save();
      ctx.translate(rocket.x, rocket.y);

      // Тело ракеты
      const gradient = ctx.createLinearGradient(0, -rocket.height / 2, 0, rocket.height / 2);
      gradient.addColorStop(0, "#b0bec5");
      gradient.addColorStop(0.5, "#eceff1");
      gradient.addColorStop(1, "#90a4ae");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(0, -rocket.height / 2);
      ctx.quadraticCurveTo(rocket.width / 2, -rocket.height / 4, rocket.width / 2, rocket.height / 2);
      ctx.lineTo(-rocket.width / 2, rocket.height / 2);
      ctx.quadraticCurveTo(-rocket.width / 2, -rocket.height / 4, 0, -rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      // Иллюминатор
      ctx.fillStyle = "#2196f3";
      ctx.beginPath();
      ctx.arc(0, -rocket.height / 4, 8, 0, Math.PI * 2);
      ctx.fill();

      // Пламя
      rocket.flameTime += 0.2;
      const flameLength = 20 + Math.sin(rocket.flameTime * 5) * 10;
      const flameGradient = ctx.createLinearGradient(0, rocket.height / 2, 0, rocket.height / 2 + flameLength);
      flameGradient.addColorStop(0, "yellow");
      flameGradient.addColorStop(1, "red");
      ctx.fillStyle = flameGradient;
      ctx.beginPath();
      ctx.moveTo(0, rocket.height / 2);
      ctx.lineTo(-10, rocket.height / 2 + flameLength);
      ctx.lineTo(10, rocket.height / 2 + flameLength);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawAsteroids() {
      for (let a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        const gradient = ctx.createRadialGradient(0, 0, a.r / 3, 0, 0, a.r);
        gradient.addColorStop(0, "#666");
        gradient.addColorStop(1, "#222");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(a.r, 0);
        for (let i = 1; i < a.sides; i++) {
          const angle = (i * Math.PI * 2) / a.sides;
          const radius = a.r * (0.7 + Math.random() * 0.3);
          ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function updateAsteroids() {
      for (let a of asteroids) {
        a.y += a.speed;
        a.angle += a.rotation;
      }
      asteroids = asteroids.filter(a => a.y < canvas.height + a.r);

      if (Math.random() < 0.03) {
        asteroids.push({
          x: Math.random() * canvas.width,
          y: -20,
          r: 20 + Math.random() * 25,
          speed: 3 + Math.random() * 3,
          angle: Math.random() * Math.PI,
          rotation: (Math.random() - 0.5) * 0.05,
          sides: 6 + Math.floor(Math.random() * 3)
        });
      }
    }

    function checkCollision() {
      for (let a of asteroids) {
        const dx = rocket.x - a.x;
        const dy = rocket.y - a.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < a.r + rocket.width / 2.5) {
          gameOver = true;
        }
      }
    }

    function drawScore() {
      ctx.fillStyle = "#fff";
      ctx.font = "24px Arial";
      ctx.fillText(`Счёт: ${score}`, 20, 40);
    }

    function clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function update() {
      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "48px Arial";
        ctx.fillText("💥 Игра окончена!", canvas.width / 2 - 180, canvas.height / 2);
        ctx.font = "24px Arial";
        ctx.fillText(`Счёт: ${score}`, canvas.width / 2 - 40, canvas.height / 2 + 40);
        ctx.fillText("Нажми F5, чтобы сыграть снова", canvas.width / 2 - 160, canvas.height / 2 + 80);
        return;
      }

      clear();
      drawStars();

      rocket.x += rocket.dx;
      rocket.x = Math.max(rocket.width / 2, Math.min(canvas.width - rocket.width / 2, rocket.x));

      updateAsteroids();
      drawAsteroids();
      drawRocket();
      drawScore();

      checkCollision();
      score++;
      requestAnimationFrame(update);
    }

    function moveLeft() { rocket.dx = -rocket.speed; }
    function moveRight() { rocket.dx = rocket.speed; }
    function stop() { rocket.dx = 0; }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") moveLeft();
      if (e.key === "ArrowRight") moveRight();
    });
    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") stop();
    });

    document.getElementById("left").addEventListener("touchstart", moveLeft);
    document.getElementById("right").addEventListener("touchstart", moveRight);
    document.getElementById("left").addEventListener("touchend", stop);
    document.getElementById("right").addEventListener("touchend", stop);

    update();
  </script>
</body>
</html>
